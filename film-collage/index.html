<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PricePilot: the agent suggests, the rules decide (paper collage film)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #2c2019; color: #f4ecd9; font: 15px/1.4 system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { width: min(96vw, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; background: #c79f72; box-shadow: 0 8px 40px rgba(0,0,0,.45); }
  body.bare main { display: block; } body.bare canvas { width: 1920px; height: 1080px; box-shadow: none; display: block; } body.bare .bar { display: none; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(96vw, 1100px); }
  .bar input[type=range] { flex: 1; accent-color: #d6492f; }
  button { font: inherit; padding: 6px 16px; border-radius: 6px; border: 0; background: #f4ecd9; color: #2c2019; cursor: pointer; }
  #time { font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
</style>
</head>
<body>
<main>
  <canvas id="film" width="1920" height="1080"></canvas>
  <div class="bar">
    <button id="play">Play</button>
    <input id="seek" type="range" min="0" max="1" step="0.001" value="0">
    <span id="time">0.00 s</span>
  </div>
  <audio id="sound" preload="auto"></audio>
</main>
<script type="module">
  import { boot, renderAt } from "./src/main.js";
  const q = new URLSearchParams(location.search);
  if (q.has("bare")) document.body.classList.add("bare");
  const canvas = document.getElementById("film"), play = document.getElementById("play"), seek = document.getElementById("seek"), time = document.getElementById("time"), sound = document.getElementById("sound");
  const film = await boot(canvas);
  window.film = { duration: film.duration, fps: film.fps, frames: film.frames, scenes: film.tl.scenes.map((s) => ({ id: s.id, start: s.start, end: s.end })), events: film.events };
  window.renderAt = renderAt;                                  // deterministic: same t, same frame
  window.frameJPEG = (i, quality = 0.97) => { renderAt(i / film.fps); return canvas.toDataURL("image/jpeg", quality); };
  window.framePNG = (t) => { renderAt(t); return canvas.toDataURL("image/png"); };
  seek.max = film.duration;
  const show = (t) => { renderAt(t); seek.value = t; time.textContent = t.toFixed(2) + " s"; };
  show(Number(q.get("t") ?? 0));
  window.ready = true;

  // Real-time preview. The sound is the mix made by audio.mjs (out/audio/mix.wav); without it the
  // picture plays silently against the clock.
  let hasSound = false, playing = false, t0 = 0, c0 = 0;
  fetch("out/audio/mix.wav", { method: "HEAD" }).then((r) => { if (r.ok) { sound.src = "out/audio/mix.wav"; hasSound = true; } }).catch(() => {});
  const now = () => (hasSound ? sound.currentTime : c0 + (performance.now() - t0) / 1000);
  function tick() {
    if (!playing) return;
    const t = now();
    if (t >= film.duration) { stop(); show(film.duration); return; }
    show(t);
    requestAnimationFrame(tick);
  }
  function start() {
    playing = true; play.textContent = "Pause";
    c0 = Number(seek.value) >= film.duration - 0.05 ? 0 : Number(seek.value); t0 = performance.now();
    if (hasSound) { sound.currentTime = c0; sound.play(); }
    requestAnimationFrame(tick);
  }
  function stop() { playing = false; play.textContent = "Play"; if (hasSound) sound.pause(); }
  play.onclick = () => (playing ? stop() : start());
  seek.oninput = () => { stop(); show(Number(seek.value)); };
  addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); play.click(); } });
</script>
</body>
</html>
